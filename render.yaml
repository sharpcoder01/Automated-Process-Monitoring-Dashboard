services:
  - type: web
    name: pulse-flow
    env: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
    healthCheckPath: /healthz
    autoDeploy: true
    numInstances: 1
    plan: free
    buildFilter:
      paths:
        - src/**/*.ts
        - public/**
        - package.json
        - package-lock.json
        - tsconfig.json
        - render.yaml